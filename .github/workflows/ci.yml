name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Playback (SoundPlayer/afplay/aplay) and PATH probing are
        # platform-dependent, and the quoting in src/backends/quote.ts picks its
        # dialect by platform — so all three families get tested, including the
        # macOS-only `say`/swift backends and shims/*.swift.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Tests run on Node's native TS type-stripping (needs 22.18+); the
        # plugin runtime itself supports Node 20+ per engines.
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: npm pack --dry-run
