# dsh-voice bundle layer: mounts the transcribe / speak tools, the voice/note
# audio cards (web client half), the readReplies narration toggle, and the
# /voice command. Users compose this bundle into a profile and override
# stt / tts / readReplies / audioDir from their own profile patch.
#
# Cloud backends (stt.backend: openai, tts.backend: edge-tts) are NEVER
# auto-selected — only whisper-local / macos STT and say / piper TTS fall
# back automatically, and nothing audio-related runs without a tool call.
- insert:
    - id: dsh-voice
      name: '@dsh-voice/bundle'
      config:
        stt: {}
        tts: {}
        readReplies: false
        audioDir: ~/.dsh/voice
